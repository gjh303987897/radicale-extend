[server]
hosts = 0.0.0.0:5232
[auth]
type = htpasswd
htpasswd_filename = /run/secrets/radicale_users
htpasswd_encryption = bcrypt
[rights]
type = owner_only
[storage]
filesystem_folder = /data/radicale/collections
[web]
type = none
[hook]
type = radicale_extend_hook
dryrun = False
[logging]
level = warning
