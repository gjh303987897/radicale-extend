name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install ./hook bcrypt==4.3.0 PyYAML==6.0.3
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal integration)"
          go vet ./...
      - name: Native integration and race tests (no Docker)
        env:
          RADICALE_PYTHON: python
        run: go test -race ./... -count=1 -timeout=5m
      - run: python -m unittest discover -s hook/tests -v
      - run: python scripts/check_assets.py

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: python -m pip install bcrypt==4.3.0 PyYAML==6.0.3
      - run: python scripts/prepare_ci.py
      - name: Build and start on GitHub Runner only
        run: docker compose -f compose.yaml -f tests/compose.ci.yaml up -d --build --wait --wait-timeout 180
      - run: python tests/compose_smoke.py
      - name: Restart Go service and verify no duplicate reminders
        run: |
          docker compose -f compose.yaml -f tests/compose.ci.yaml restart app
          python tests/compose_smoke.py --after-restart
      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f tests/compose.ci.yaml logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml -f tests/compose.ci.yaml down -v
    env:
      APP_IMAGE: radicale-extend-ci
      RADICALE_IMAGE: radicale-extend-ci-radicale
      IMAGE_TAG: ci
      APP_CONFIG: ./.cache/ci.yaml
      SECRETS_DIR: ./.cache/ci-secrets
