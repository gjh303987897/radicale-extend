[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radicale-extend-hook"
version = "0.1.0"
description = "Minimal durable notification adapter for radicale-extend"
requires-python = ">=3.11"
dependencies = ["Radicale==3.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["radicale_extend_hook*"]
